name: Release

# Every push to main bumps the patch version, tags it, and publishes a release zip.
# Sites running the plugin see that release as an available update within ~12 hours,
# or immediately via "Check again" on the WordPress Updates screen.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The version-bump commit below is itself a push to main. Skip those runs so we
    # don't loop. Also skip if a human marks a commit [skip ci].
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the default token so the bump commit is attributed to the Actions bot.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          FILE=mps-care-plan-widget.php
          CURRENT=$(grep -m1 -oE '^ \* Version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' "$FILE" \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read a semver Version header from $FILE"
            exit 1
          fi
          MAJOR=${CURRENT%%.*}
          REST=${CURRENT#*.}
          MINOR=${REST%%.*}
          PATCH=${REST##*.}
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          # Anchored to the header line so a version string elsewhere can't be hit.
          sed -i -E "s|^( \* Version:[[:space:]]*)$CURRENT$|\1$NEXT|" "$FILE"
          grep -q "^ \* Version:.*$NEXT$" "$FILE"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Bumped $CURRENT -> $NEXT"

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mps-care-plan-widget.php
          git commit -m "Bump version to ${{ steps.bump.outputs.next }} [skip ci]"
          git tag "v${{ steps.bump.outputs.next }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.next }}"

      - name: Build plugin zip
        run: |
          set -euo pipefail
          # export-ignore rules in .gitattributes keep dev files out of the zip.
          # The prefix must match the plugin folder name WordPress installs into.
          git archive --format=zip \
            --prefix=mps-care-plan-widget/ \
            -o mps-care-plan-widget.zip \
            "v${{ steps.bump.outputs.next }}"
          unzip -l mps-care-plan-widget.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "v${{ steps.bump.outputs.next }}" \
            mps-care-plan-widget.zip \
            --title "v${{ steps.bump.outputs.next }}" \
            --generate-notes
